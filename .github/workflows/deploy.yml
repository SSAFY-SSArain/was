name: Backend Continuous Deployment

on:
  push:
    branches: ['main']

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./docker/Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/ssarain-api:latest

      - name: Prepare compose directory on EC2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            mkdir -p "$HOME/ssarain/was/docker"

      - name: Upload compose file to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: 'docker/docker-compose.production.yml'
          target: '~/ssarain/was/docker'
          strip_components: 1

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd "$HOME/ssarain/was/docker"

            sudo docker rm -f spring-app || true

            sudo docker pull ${{ secrets.DOCKERHUB_USERNAME }}/ssarain-api:latest
            sudo docker tag ${{ secrets.DOCKERHUB_USERNAME }}/ssarain-api:latest ssarain-api:latest

            trap 'rm -f .env' EXIT

            # EOF 대신 echo를 사용하여 YAML 들여쓰기 규칙 준수
            echo "MYSQL_URL=jdbc:mysql://${{ secrets.RDS_ENDPOINT }}:3306/ssarain?serverTimezone=Asia/Seoul&sessionVariables=time_zone='%2B09:00'&characterEncoding=UTF-8" > .env
            echo "MYSQL_USER=${{ secrets.RDS_USERNAME }}" >> .env
            echo "MYSQL_PASSWORD=${{ secrets.RDS_PASSWORD }}" >> .env
            echo "VALKEY_PASSWORD=${{ secrets.VALKEY_PASSWORD }}" >> .env
            echo "JWT_ACCESS_SECRET=${{ secrets.JWT_ACCESS_SECRET }}" >> .env
            echo "JWT_REFRESH_SECRET=${{ secrets.JWT_REFRESH_SECRET }}" >> .env
            echo "GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}" >> .env
            echo "SMTP_EMAIL=${{ secrets.SMTP_EMAIL }}" >> .env
            echo "SMTP_PASSWORD=${{ secrets.SMTP_PASSWORD }}" >> .env
            echo "CORS_ALLOWED_ORIGIN=${{ secrets.CORS_ALLOWED_ORIGIN }}" >> .env

            sudo docker compose -f docker-compose.production.yml up -d valkey
            sudo docker compose -f docker-compose.production.yml up -d --force-recreate --no-deps spring-api
            sudo docker image prune -f
