name: Java CI/CD with Docker and EC2

on:
  push:
    branches: [ "ci/cd" ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./docker/Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/spring-app:latest

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v0.1.6
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            # 기존 컨테이너 중지 및 삭제
            sudo docker stop spring-app || true
            sudo docker rm spring-app || true
            
            # 최신 이미지 풀
            sudo docker pull ${{ secrets.DOCKERHUB_USERNAME }}/spring-app:latest
            
            # 환경변수 주입 및 컨테이너 실행
            sudo docker run -d --name spring-app \
              -p 8080:8080 \
              -e SPRING_PROFILES_ACTIVE=production \
              -e MYSQL_URL="jdbc:mysql://${{ secrets.RDS_ENDPOINT }}:3306/ssarain?serverTimezone=Asia/Seoul&characterEncoding=UTF-8" \
              -e MYSQL_USER=${{ secrets.RDS_USERNAME }} \
              -e MYSQL_PASSWORD=${{ secrets.RDS_PASSWORD }} \
              -e VALKEY_PASSWORD=${{ secrets.VALKEY_PASSWORD }} \
              - e JWT_ACCESS_SECRET=${{ secrets.JWT_ACCESS_SECRET }} \
              - e JWT_REFRESH_SECRET=${{ secrets.JWT_REFRESH_SECRET }} \
              ${{ secrets.DOCKERHUB_USERNAME }}/spring-app:latest
            
            # 사용하지 않는 오래된 이미지 삭제
            sudo docker image prune -f