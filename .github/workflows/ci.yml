name: Java CI

on:
  pull_request:
    branches: [ "main" ]

# 이전에 작업 중인 워크플로 취소
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: mock_password
          MYSQL_DATABASE: ssarain_test
        ports:
          - 3306:3306
        # 헬스체크
        options: --health-cmd="mysqladmin ping" --health-interval=5s --health-timeout=3s --health-retries=5

      redis:
        image: redis:7.0-alpine
        ports:
          - 6379:6379
        options: --health-cmd="redis-cli ping" --health-interval=10s --health-timeout=5s --health-retries=5

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build with Gradle (or Maven)
        env:
          MYSQL_URL: jdbc:mysql://localhost:3306/ssarain_test?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul
          MYSQL_USER: root
          MYSQL_PASSWORD: mock_password
          VALKEY_HOST: localhost
          VALKEY_HOST_PORT: 6379
          VALKEY_PASSWORD: mock_password
          JWT_ACCESS_SECRET: dGhpcy1pcy1hLXNhbXBsZS1zZWNyZXQta2V5LWZvci1qd3QtYWNjZXNzLXRva2VuLXNhbXBsZS1zZWNyZXQ
          JWT_REFRESH_SECRET: dGhpcy1pcy1hLXNhbXBsZS1zZWNyZXQta2V5LWZvci1qd3QtYWNjZXNzLXRva2VuLXNhbXBsZS1zZWNyZXQ
          CORS_ALLOWED_ORIGIN: http://localhost:3000
          SMTP_EMAIL: mock_email
          SMTP_PASSWORD: mock_password
          GEMINI_API_KEY: mock_key
        run: |
          chmod +x ./gradlew
          ./gradlew build
