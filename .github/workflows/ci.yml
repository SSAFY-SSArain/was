name: Java CI

on:
  pull_request:
    branches: [ "main" ]

# 이전에 작업 중인 워크플로 취소
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build with Gradle (or Maven)
        run: |
          chmod +x ./gradlew
          ./gradlew build