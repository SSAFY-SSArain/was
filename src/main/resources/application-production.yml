spring:
  datasource:
    url: ${MYSQL_URL}
    username: ${MYSQL_USER}
    password: ${MYSQL_PASSWORD}
  data:
    redis:
      host: ${VALKEY_HOST:localhost}
      port: ${VALKEY_HOST_PORT:6379}
      password: ${VALKEY_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update # TODO: 개발 후 validate로 변경
    properties:
      hibernate:
        # Pagination에는 Fetch Join 사용이 어려우므로 Batch 방식을 사용합니다.
        default_batch_fetch_size: 100
        format_sql: false
        show_sql: false
        jdbc:
          time_zone: Asia/Seoul
  jackson:
    time-zone: Asia/Seoul

app:
  cors:
    allowed-origins:
      - ${CORS_ALLOWED_ORIGIN:http://localhost:5173}
