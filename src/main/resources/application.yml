spring:
  application:
    name: ssarain
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:develop}
  mail:
    host: smtp.naver.com
    port: 587
    username: ${SMTP_EMAIL}
    password: ${SMTP_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

app:
  rate-limit:
    endpoints:
      "[POST /api/v1/auth/login]":
        scope: anonymous
        capacity: ${RATE_LIMIT_LOGIN_CAPACITY:30}
        duration-minutes: ${RATE_LIMIT_LOGIN_DURATION_MINUTES:1}
        refill-strategy: greedy
      "[GET /api/v1/auth/refresh]":
        scope: authenticated
        capacity: ${RATE_LIMIT_REFRESH_CAPACITY:10}
        duration-minutes: ${RATE_LIMIT_REFRESH_DURATION_MINUTES:1}
        refill-strategy: greedy
      "[POST /api/v1/auth/email/request]":
        scope: anonymous
        capacity: ${RATE_LIMIT_EMAIL_CAPACITY:10}
        duration-minutes: ${RATE_LIMIT_EMAIL_DURATION_MINUTES:1}
        refill-strategy: greedy
      "[POST /api/v1/auth/email/verify]":
        scope: anonymous
        capacity: ${RATE_LIMIT_EMAIL_VERIFY_CAPACITY:10}
        duration-minutes: ${RATE_LIMIT_EMAIL_VERIFY_DURATION_MINUTES:1}
        refill-strategy: greedy
      "[POST /api/v1/quizzes]":
        scope: authenticated
        capacity: ${RATE_LIMIT_QUIZ_CAPACITY:3}
        duration-minutes: ${RATE_LIMIT_QUIZ_DURATION_MINUTES:1}
        refill-strategy: greedy
  jwt:
    issuer: ssarain
    access-token-secret: ${JWT_ACCESS_SECRET}
    refresh-token-secret: ${JWT_REFRESH_SECRET}
    access-token-expiration-seconds: 3600
    refresh-token-expiration-seconds: 1209600
  cors:
    allowed-methods:
      - GET
      - POST
      - PUT
      - PATCH
      - DELETE
      - OPTIONS
    allowed-headers:
      - "*"
    exposed-headers:
      - Authorization
  gemini:
    api-key: ${GEMINI_API_KEY}
    model: gemini-3.5-flash
